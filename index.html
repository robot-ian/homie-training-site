<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Operations Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --paper:#EEF1F4;
  --panel:#FFFFFF;
  --ink:#0F1E2E;
  --ink-soft:#4A5C6E;
  --rule:#C7D0D9;
  --signal:#2B5FD9;   /* active / in progress */
  --amber:#B5791A;    /* locked / pending */
  --clear:#1B7A5A;    /* cleared / passed */
  --alert:#B4342B;    /* incorrect */

  --display:'Archivo',system-ui,sans-serif;
  --body:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --gap:clamp(16px,3vw,32px);
  --maxw:1180px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.65;
}
h1,h2,h3,.u{font-family:var(--display);letter-spacing:-.01em}
.u{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* ============================================================
   MASTHEAD
   ============================================================ */
.masthead{
  border-bottom:1px solid var(--rule);
  background:var(--panel);
  position:sticky;top:0;z-index:40;
}
.masthead__in{
  max-width:var(--maxw);margin:0 auto;padding:14px var(--gap);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.mark{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.mark span{color:var(--ink-soft);font-weight:500}
.meter{margin-left:auto;display:flex;align-items:center;gap:12px}
.meter__track{width:clamp(80px,18vw,200px);height:4px;background:var(--rule);position:relative;overflow:hidden}
.meter__fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--clear);transition:width .5s cubic-bezier(.4,0,.2,1)}
.meter__num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ============================================================
   SHELL
   ============================================================ */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--gap) 96px;display:grid;gap:clamp(24px,4vw,56px);grid-template-columns:1fr}
@media(min-width:960px){.shell{grid-template-columns:270px 1fr;align-items:start;padding-top:44px}
.shell.is-solo{grid-template-columns:minmax(0,1fr)}}

/* ============================================================
   CHECKLIST RAIL  — the signature element
   ============================================================ */
.rail{padding-top:28px}
@media(min-width:960px){.rail{position:sticky;top:96px;padding-top:0}}
.rail__title{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule);color:var(--ink-soft)}
.rail__list{list-style:none;margin:0;padding:0}
.rung{
  display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;
  width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:11px 0;border-bottom:1px solid rgba(199,208,217,.55);
  font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink-soft);
}
.rung:disabled{cursor:not-allowed}
.rung__no{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em}
.rung__state{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.rung[data-s="locked"]{opacity:.5}
.rung[data-s="locked"] .rung__state{color:var(--amber)}
.rung[data-s="active"]{color:var(--ink)}
.rung[data-s="active"] .rung__no,.rung[data-s="active"] .rung__state{color:var(--signal)}
.rung[data-s="cleared"] .rung__no,.rung[data-s="cleared"] .rung__state{color:var(--clear)}
.rung.is-open{color:var(--ink);font-weight:600}
.rung:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* ============================================================
   STAGE
   ============================================================ */
.stage{padding-top:28px;min-width:0}
@media(min-width:960px){.stage{padding-top:0}}
.eyebrow{color:var(--ink-soft);margin-bottom:10px}
.stage h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:0 0 18px;font-weight:700}
.lede{font-size:19px;color:var(--ink-soft);margin:0 0 28px;max-width:62ch}
.prose{max-width:66ch}
.prose h2{
  font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;
  margin:52px 0 22px;padding-top:22px;border-top:2px solid var(--ink);
}
.prose h2:first-child{margin-top:0;padding-top:0;border-top:0}
.prose h3{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--signal);
  margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule);
}
.prose h3:first-child{margin-top:0}
.prose h4{
  font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em;
  margin:26px 0 8px;
}
.prose p{margin:0 0 18px}
.prose em{font-family:var(--display);font-style:normal;font-weight:600;font-size:18px;letter-spacing:-.01em}
.prose ul{margin:0 0 18px;padding-left:20px}
.prose li{margin-bottom:8px}
.prose strong{font-weight:600}
.prose code{font-family:var(--mono);font-size:14px;background:rgba(43,95,217,.08);padding:2px 6px;border:1px solid var(--rule)}

.fig{margin:0 0 26px;max-width:66ch}
.fig img,.fig video{width:100%;height:auto;display:block;border:1px solid var(--rule);background:var(--ink)}
.fig figcaption{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);margin-top:8px}
.fig--portrait{max-width:340px}
.fig--portrait iframe{width:100%;aspect-ratio:9/16;border:1px solid var(--rule);display:block}
.looms{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 26px;max-width:66ch}
.looms__lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:2px}
.looms__lab:not(:first-child){margin-left:10px}
.looms a{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-decoration:none;
  color:var(--signal);border:1px solid var(--rule);padding:5px 10px;background:var(--panel);
}
.looms a:hover{border-color:var(--signal)}
.warn{border-left:3px solid var(--alert);background:rgba(180,52,43,.05);padding:18px 20px;margin:0 0 26px;max-width:66ch}
.warn p{margin:0 0 10px}
.warn p:last-child{margin-bottom:0}
.frame{position:relative;padding-top:56.25%;background:var(--ink);margin:0 0 30px;border:1px solid var(--rule)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.divider{height:1px;background:var(--rule);margin:38px 0;border:0}

/* ============================================================
   QUIZ
   ============================================================ */
.handoff{
  display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--signal);
  padding:22px 24px;max-width:66ch;
}
.handoff .note{max-width:42ch}

.quiz{background:var(--panel);border:1px solid var(--rule);padding:clamp(20px,3.4vw,34px);max-width:66ch}
.quiz__head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;color:var(--ink-soft)}
.quiz h2{font-size:22px;margin:0 0 26px;font-weight:600}
.q{margin-bottom:26px;padding-bottom:26px;border-bottom:1px solid rgba(199,208,217,.6)}
.q:last-of-type{border-bottom:0}
.q__text{font-weight:600;margin:0 0 14px;font-family:var(--display);font-size:16px;line-height:1.45}
.opt{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;margin:0 0 5px;cursor:pointer;border:1px solid transparent;font-size:16px;line-height:1.45}
.opt:hover{background:rgba(43,95,217,.05)}
.opt input{margin:5px 0 0;accent-color:var(--signal);flex:none}
.opt.ok{border-color:var(--clear);background:rgba(27,122,90,.07)}
.opt.no{border-color:var(--alert);background:rgba(180,52,43,.06)}
.flag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-left:auto;padding-left:10px;flex:none}
.opt.ok .flag{color:var(--clear)}
.opt.no .flag{color:var(--alert)}

.btn{
  font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.01em;
  padding:12px 24px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  cursor:pointer;transition:opacity .15s;
}
.btn:hover{opacity:.85}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.btn--ghost{background:none;color:var(--ink)}
a.btn{display:inline-block;text-decoration:none;line-height:1.2}
.btn--go{background:var(--clear);border-color:var(--clear);color:#fff}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}

.verdict{margin-top:20px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;letter-spacing:.02em;border-left:3px solid}
.verdict[data-v="pass"]{border-color:var(--clear);background:rgba(27,122,90,.07);color:var(--clear)}
.verdict[data-v="fail"]{border-color:var(--alert);background:rgba(180,52,43,.06);color:var(--alert)}

/* ============================================================
   GATE / INTRO / CERTIFICATE
   ============================================================ */
.card{background:var(--panel);border:1px solid var(--rule);padding:clamp(24px,4vw,46px);max-width:60ch;width:100%}
.field{display:block;margin:22px 0 8px}
.field input{
  width:100%;max-width:340px;padding:11px 13px;border:1px solid var(--rule);
  background:var(--paper);font-family:var(--body);font-size:17px;color:var(--ink);
}
.field input:focus{outline:2px solid var(--signal);outline-offset:1px}
.note{font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--ink-soft);letter-spacing:.02em}

.cert{border:2px solid var(--ink);padding:clamp(28px,5vw,58px);background:var(--panel);text-align:center;max-width:62ch}
.cert__seal{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.cert__name{font-family:var(--display);font-size:clamp(26px,5vw,40px);font-weight:700;margin:22px 0 6px;line-height:1.15}
.cert__line{width:70px;height:2px;background:var(--ink);margin:22px auto}
.cert__meta{font-family:var(--mono);font-size:12px;line-height:2;color:var(--ink-soft);letter-spacing:.04em}
.cert__code{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.18em;color:var(--ink);margin-top:4px}

.hidden{display:none !important}

@media print{
  .masthead,.rail,.noprint{display:none !important}
  body{background:#fff}
  .shell{display:block;padding:0}
  .cert{border-color:#000;max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail hidden" id="rail" aria-label="Module checklist">
    <div class="u rail__title">Checklist</div>
    <ul class="rail__list" id="railList"></ul>
  </nav>
  <main class="stage" id="stage"></main>
</div>

<script>
/* ==================================================================
   ██  CONFIG  ██  — EDIT FROM HERE DOWN
   ==================================================================

   Adding a module: copy one { ... } block, paste it, change the text.
   Removing one: delete the whole { ... } block including its comma.
   Order in this list = order trainees must complete it in.

   video:  the YouTube ID only — the part after "v=" in the URL.
           https://www.youtube.com/watch?v=dQw4w9WgXcQ  ->  "dQw4w9WgXcQ"
           Leave as ""  for a text-only module.
   answer: which option is correct, counting from 0.
           First option = 0, second = 1, third = 2, fourth = 3.

const PASS_MARK = 1.0;   // 1.0 = must get every question right. 0.8 = 80%.

const MODULES = [
  {
    title: "The mission, the vocabulary, and how you're measured",
    lede: "Before you touch a controller, you need the shape of the job and the words the team uses to describe it.",
    video: "",
    body: `
      <h3>What we do</h3>
      <p><strong>We collect the data that teaches humanoid robots how to live in the real world.</strong></p>
      <p>Most robotics data comes from labs — controlled lighting, flat floors, no surprises. That data
      produces robots that work beautifully in labs. We do the opposite. We put Homie into real
      environments and capture what actually happens there.</p>
      <p>That started in homes: real clutter, real staircases, real inconsistent lighting. We're now
      expanding into public environments, which adds a harder layer — moving crowds, unpredictable
      obstacles, bystanders who didn't ask to be part of a collection session, and spaces where you
      don't control who walks through the frame.</p>
      <p>Both settings matter, and they teach different things. Homes teach a robot to work in confined,
      personal, object-dense space. Public environments teach it scale, movement, and people it hasn't
      met. A humanoid that can only handle one of those isn't much use.</p>
      <p>We're pioneers in teleoperation for humanoid data collection in natural settings. The datasets
      we build now are what future research is built on top of. The work is early, which means the
      standard you hold yourself to matters more than usual — there is no large existing dataset to
      average out your mistakes.</p>

      <h3>Four things define the job</h3>
      <ul>
        <li><strong>Collect high quality data.</strong> A technically clean session — correct calibration,
        complete metadata, no drift.</li>
        <li><strong>Collect diverse data.</strong> Different homes, layouts, public settings, crowd
        densities, lighting. Variety is the point, not a bonus.</li>
        <li><strong>Protect your robot.</strong> Homie is expensive, fragile, and irreplaceable on a
        schedule — and in public, more exposed.</li>
        <li><strong>Respect the environment.</strong> Whether it's someone's living room or a shared
        public space, you leave it as you found it.</li>
      </ul>
      <p><em>Real places, real data, handled with care.</em></p>
      <p>One line to carry with you: <strong>Homie learns from how you move it.</strong> You are not
      operating a machine — you are demonstrating what a body does in a room.</p>

      <h3>Who's involved</h3>
      <ul>
        <li><strong>Agent</strong> — you, the operator running the session</li>
        <li><strong>Homie</strong> — the humanoid robot</li>
        <li><strong>Homeowner</strong> — the owner of the home you are collecting data in</li>
        <li><strong>Venue Contact</strong> — the equivalent in a public environment: the venue or
        property manager responsible for the space, whose permission you need before collection begins</li>
      </ul>

      <h3>What you touch</h3>
      <ul>
        <li><strong>Controller</strong> — Homie's startup controller device</li>
        <li><strong>VR</strong> — the headset you wear to control Homie during collection</li>
        <li><strong>Motion sensor</strong> — the VR motion sensor worn on your leg, tracking your
        lower-body movement so Homie moves as you do</li>
      </ul>

      <h3>Where you work</h3>
      <p>Five platforms, each with one job. Learn which is which now — confusing them mid-session
      costs you time you don't have.</p>
      <ul>
        <li><strong>Unitree App</strong> — starts the robot's initial program</li>
        <li><strong>Homie Site</strong> — activates the VR program, enables debug mode, checks datasets</li>
        <li><strong>VR Site</strong> — activates VR control</li>
        <li><strong>Homie Dashboard</strong> — your progress and personal KPI</li>
        <li><strong>Service tab</strong> — restarts the gripper, wrist, or head camera. Inside the Unitree
        App the same screen is labelled <strong>Service Status</strong> — same place, two names</li>
      </ul>

      <h3>Two things you'll be asked about</h3>
      <ul>
        <li><strong>Debug Mode</strong> — lets the tech team monitor and troubleshoot remotely</li>
        <li><strong>Dataset</strong> — how you verify data is uploading correctly</li>
      </ul>

      <h3>How your work is measured</h3>
      <p>Three numbers, not one:</p>
      <ul>
        <li><strong>Hours</strong> — how much data you collect.</li>
        <li><strong>Failure rate</strong> — what went wrong. Dropped objects, or Homie sitting idle.</li>
        <li><strong>Behaviour rate</strong> — whether Homie moved the way a body should.</li>
      </ul>
      <p>Three measures means there's no shortcut. Rush and your failure rate rises. Over-polish and
      your hours fall. A later module covers each in detail — for now, know they exist, and know
      they pull against each other.</p>`,
    quiz: [
      {
        q: "What makes our data valuable compared to lab-collected robotics data?",
        options: [
          "It's captured at higher resolution",
          "It's collected in real, uncontrolled home and public environments",
          "It's collected in greater volume",
          "It's reviewed by more researchers"
        ],
        answer: 1,
        why: "The setting is the product. Clean lab data already exists in quantity — real, messy environments are what we add."
      },
      {
        q: "Your gripper stops responding mid-session. Which platform do you go to first?",
        options: ["Unitree App", "Service tab", "VR Site", "Homie Dashboard"],
        answer: 1,
        why: "The Service tab restarts the gripper, wrist, and head camera. In the Unitree App it appears as Service Status."
      },
      {
        q: "The tech team messages you asking to look at a problem remotely. What do you need to enable, and where?",
        options: [
          "Debug Mode, on the Homie Site",
          "Debug Mode, on the VR Site",
          "Service Status, on the Unitree App",
          "Dataset, on the Unitree App"
        ],
        answer: 0,
        why: "Debug Mode is what lets the tech team monitor and troubleshoot, and it's enabled from the Homie Site."

      {

        answer: 2,

        answer: 2,
        why: "Three measures. Hours alone doesn't count — and neither does clean data with unnatural movement in it."
      }
    ]

  {
    title: "Your Homie: knowing the machine you operate",
    lede: "The G1 hardware — what it can do, what powers it, what sees, and what breaks.",
    video: "",
    body: `
      <figure class="fig">
        <img src="assets/homie-legs.png" alt="Homie, the Unitree G1 humanoid robot">
      </figure>

      <h3>What Homie is</h3>
      <p>The Homie you'll be operating is a <strong>Unitree G1</strong>. Three numbers shape how you
      work with it:</p>
      <ul>
        <li><strong>About 35 kg.</strong> This is not a machine you catch if it falls, and not one you
        lift casually or alone.</li>
        <li><strong>23 degrees of freedom</strong> in the base configuration — the number of independent
        joints it can move. That's what lets it copy a human body rather than approximate one.</li>
        <li><strong>Around 1.5 hours of runtime per battery.</strong> This is the number that shapes your
        session planning. Know where you are in the charge before you start something long.</li>
      </ul>

      <h3>Battery and charging</h3>
      <p><strong>To turn Homie on:</strong> push the battery into the bot until you hear a click. Then
      press once and release. Then press again, hold for two seconds, and release. The lights turn green.</p>
      <p>It's a specific sequence — click, short press, long press — and it exists to stop the robot
      powering up accidentally. If nothing happens, start the sequence again rather than holding the
      button down.</p>
      <figure class="fig">
        <img src="assets/battery-lights.jpg" alt="Battery mounted in Homie's torso showing green charge lights">
        <figcaption>Green lights confirm the robot is powered on.</figcaption>
      </figure>
      <p><strong>To remove the battery:</strong> press the two square catches until you hear a click, then

      <figure class="fig">
        <video controls preload="metadata" playsinline src="assets/battery-removal.mp4"></video>
        <figcaption>Releasing and removing the battery.</figcaption>
      </figure>
      <p><strong>Reading the charger:</strong> a red light means it's charging. A green light means it's
      fully charged. Red is not "ready" — a battery on red will not give you a full session.</p>

      <h3>The cameras</h3>
      <p>Three cameras collect your data. If one isn't working, the session isn't capturing what it
      should, so knowing which is which matters when you're troubleshooting.</p>
      <figure class="fig">
        <img src="assets/wrist-camera.jpg" alt="Wrist camera mounted on Homie's arm">
        <figcaption>Wrist camera.</figcaption>
      </figure>
      <figure class="fig">
        <img src="assets/head-camera.jpg" alt="Head camera mounted on Homie's head">
        <figcaption>Head camera.</figcaption>
      </figure>
      <p>All of these parts are bound to the robot with a <strong>3D print</strong> — a custom mount
      rather than a factory fitting.</p>
      <figure class="fig">
        <img src="assets/3d-print-mounts.jpg" alt="3D printed mount holding a camera to the robot">
      </figure>
      <p>They connect to the bot through a <strong>hub port</strong>.</p>
      <figure class="fig">
        <img src="assets/hub-port.jpg" alt="Hub port on the robot where camera cables connect">
      </figure>
      <figure class="fig">
        <img src="assets/wrist-camera-wires.jpg" alt="Wrist camera wiring routed along the arm">
        <figcaption>Wrist camera wires.</figcaption>
      </figure>

      <h3>The port</h3>
      <p>The port is where everything plugs in: the hub itself, the power for the hub, and the LAN
      cables. If a camera or the hub isn't being detected, this panel is where you look.</p>
      <figure class="fig">
        <img src="assets/port-panel.jpg" alt="Robot port panel showing BAT, 24V and 12V power terminals, two LAN sockets and USB-C ports">
        <figcaption>Power terminals on the left, LAN sockets in the centre, USB-C on the right.</figcaption>

      <p>Seven standards, split by how much they cost you.</p>

      <h3>Major errors</h3>

      <h4>CRAB — no crab walking</h4>
      <p>Avoid prolonged sideways movement, lateral shuffling, or any situation where the head camera
      is pointing somewhere clearly different from where the body is travelling.</p>
      <p><strong>Do this instead:</strong> while moving, the head camera should face the destination.
      Turn the robot to face where it's going first, then walk forward.</p>
      <div class="looms">
        <span class="looms__lab">What it looks like</span>
        <a href="https://www.loom.com/share/a100078a991445ebb2672544c2a690cf" target="_blank" rel="noopener">Example 1</a>
        <a href="https://www.loom.com/share/4e5a872010ea413ab38b90108253b116" target="_blank" rel="noopener">Example 2</a>
        <span class="looms__lab">Done right</span>
        <a href="https://www.loom.com/share/9589f75a3cf44ca18ebb8c9a9bdb842a" target="_blank" rel="noopener">Correct 1</a>
      </div>

      <h4>IDLE HAND — no hand left hanging</h4>
      <p>One hand doing everything while the other hangs unused looks unnatural and makes the
      coordination between the two hands poor.</p>
      <p><strong>Do this instead:</strong> coordinate both hands. If the left hand is holding
      something, the right can already be moving in to assist rather than arriving at the last moment.</p>
      <div class="looms">
        <span class="looms__lab">What it looks like</span>
        <a href="https://www.loom.com/share/d7c7c14430c9478a9d76283e8db9e976" target="_blank" rel="noopener">Example 1</a>
        <a href="https://www.loom.com/share/b4d02e0f26cd42c18887fab01aac7052" target="_blank" rel="noopener">Example 2</a>
        <span class="looms__lab">Done right</span>
        <a href="https://www.loom.com/share/9b2cb567715049dbae3a8c5a2c9c7e53" target="_blank" rel="noopener">Correct 1</a>
        <a href="https://www.loom.com/share/6823c044921c49c381b09139820df0af" target="_blank" rel="noopener">Correct 2</a>
      </div>

      <h4>OFF FRAMING — keep the target centred</h4>
      <p>The object you're working with should sit in the centre of the camera frame, not drift to the
      edge of it.</p>
      <div class="looms">
        <span class="looms__lab">What it looks like</span>
        <a href="https://www.loom.com/share/211e019e9e724d2f8ec22349e9811f9a" target="_blank" rel="noopener">Example 1</a>
        <a href="https://www.loom.com/share/89a9798698e9411db90e2d4f79cb22f8" target="_blank" rel="noopener">Example 2</a>
        <span class="looms__lab">Done right</span>
        <a href="https://www.loom.com/share/7825f1531d61434aae17e3b4e1cb1dfe" target="_blank" rel="noopener">Correct 1</a>
      </div>

      <h4>BUTLER — be a proper butler</h4>
      <p>Nothing rushed, nothing tossed, nothing left half-done. Place objects rather than dropping
      them, and use both hands for small final adjustments. Be neat.</p>
      <div class="looms">
        <span class="looms__lab">What it looks like</span>
        <a href="https://www.loom.com/share/9d0dda77bde34af8a850e116bd77e468" target="_blank" rel="noopener">Example 1</a>
      </div>

      <h4>BLUR — clear, stable images</h4>
      <p>Movement fast enough to smear the image costs you the frame.</p>
      <figure class="fig">
        <img src="assets/blur-example.jpg" alt="Example of a blurred, unusable camera frame">
      </figure>

      <h3>Minor errors</h3>

      <h4>SHUFFLE — no foot shuffling after arrival</h4>
      <p>Paths should be natural, direct and continuous. Avoid repeated left-right micro-steps, moving
      back and forth, or spinning on the spot to correct position.</p>
      <p><strong>Do this instead:</strong> plan the approach and do it in one go. If you need to change
      direction, complete a clear turn, then continue in a straight line.</p>
      <div class="looms">
        <span class="looms__lab">What it looks like</span>
        <a href="https://www.loom.com/share/943f25dbce874ab091d2de2005f72be3" target="_blank" rel="noopener">Example 1</a>
        <a href="https://www.loom.com/share/06e97bff01504c40959d70a0c7cb0fa9" target="_blank" rel="noopener">Example 2</a>
        <span class="looms__lab">Done right</span>
        <a href="https://www.loom.com/share/e012c5d25b744a42b46443fee3c3ef34" target="_blank" rel="noopener">Correct 1</a>
      </div>

      <h4>PATHING — follow human logic</h4>
      <p>Movement and task order should follow the sequence a person would actually use. Walk to
      position before raising the hands, rather than walking with hands already up. Reach for the broom
      rather than starting with it already held.</p>
      <div class="looms">
        <span class="looms__lab">What it looks like</span>
        <a href="https://www.loom.com/share/f0a49c5946754696bf1b3f7825411848" target="_blank" rel="noopener">Example 1</a>
        <a href="https://www.loom.com/share/68161414bd6542849f719ac7a03750a4" target="_blank" rel="noopener">Example 2</a>
        <span class="looms__lab">Done right</span>
        <a href="https://www.loom.com/share/0c0aa46d3f774fbe91b299d7523f3c53" target="_blank" rel="noopener">Correct 1</a>
      </div>

      <h3>The thread running through all seven</h3>
      <p>Every one of these is the same question asked differently: <em>would a person have done it that
      way?</em> If the answer is no, it's a behaviour error — even when the task was completed and
      nothing was dropped.</p>`,
    quiz: [
      {
        q: "Homie needs to get to a table on its left. What's the correct movement?",
        options: [
          "Step sideways towards it, keeping the head camera on the table",
          "Turn to face the table, then walk forward",
          "Walk forward past it, then turn back",
          "Either, as long as the task gets done"
        ],
        answer: 1,
        why: "Turn first, then walk forward. Sideways travel with the head facing elsewhere is crab walking — a major error."
      },
      {
        q: "You're carrying out a task that only really needs one hand. What should the other hand be doing?",
        options: [
          "Hanging by the side, out of the frame",
          "Assisting or moving into position to help",
          "Resting on the robot's body to keep it stable",
          "Nothing — one-handed tasks are one-handed"
        ],
        answer: 1,
        why: "Idle hand is a major error. Coordinate both, and bring the second hand in early rather than at the last moment."
      },
      {
        q: "Which of these is a MINOR error rather than a major one?",
        options: [
          "Blurred, unstable images",
          "The target object drifting off-centre in the frame",
          "Small back-and-forth foot shuffles after arriving",
          "Tossing an item instead of placing it"
        ],
        answer: 2,
        why: "Shuffle and pathing are the two minors. Crab, idle hand, off framing, butler and blur are all majors."
      },
      {
        q: "You've finished moving a pillow onto the sofa. What does 'being a proper butler' ask of you?",
        options: [
          "Complete it quickly so the episode stays short",
          "Place it and use both hands for small adjustments",
          "Drop it on the sofa and move to the next task",
          "Step back so the whole sofa is in frame"
        ],
        answer: 1,
        why: "Nothing rushed, tossed or half-done. Place it, then tidy it with both hands."
      },
      {
        q: "A session drops nothing, has no idle time, and uploads cleanly — but Homie walked with its hands already raised and shuffled into position on arrival. How does it score?",
        options: [
          "Fine on both measures",
          "Good failure rate, but behaviour errors",
          "Good behaviour rate, but a failure",
          "It fails entirely and has to be recollected"
        ],
        answer: 1,
        why: "Nothing failed, so failure rate is fine. But walking with hands up is a pathing error and shuffling is a shuffle error — both behaviour."
      }
    ]
  },
];

const KEY = 'fb-onboard-v1';
let S = load();
let openIdx = 0;
let phase = 'read';   // 'read' = material screen, 'quiz' = check screen

function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && typeof r === 'object') return {name:r.name||'', done:Array.isArray(r.done)?r.done:[], finished:!!r.finished};
  }catch(e){}
  return {name:'', done:[], finished:false};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ /* private browsing — progress just won't persist */ }
}
function cleared(i){ return S.done.includes(i); }
function unlocked(i){ return i === 0 || cleared(i-1); }
function nextOpen(){
  for(let i=0;i<MODULES.length;i++) if(!cleared(i)) return i;
  return MODULES.length - 1;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function code(){
  const seed = (S.name || 'trainee').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3).padEnd(3,'X');
  let n = 0;
  for(const ch of (S.name||'') + MODULES.length) n = (n*31 + ch.charCodeAt(0)) % 9973;
  return seed + '-' + String(n).padStart(4,'0');
}

/* ---------- chrome ---------- */
function paintMeter(){
  const pct = MODULES.length ? (S.done.length / MODULES.length) * 100 : 0;
  document.getElementById('meterFill').style.width = pct + '%';
  document.getElementById('meterNum').textContent = S.done.length + ' / ' + MODULES.length;
}
function paintRail(){
  const rail = document.getElementById('rail');
  const shell = document.querySelector('.shell');
  if(!S.name){
    rail.classList.add('hidden');
    if(shell) shell.classList.add('is-solo');
    return;
  }
  rail.classList.remove('hidden');
  if(shell) shell.classList.remove('is-solo');
  const list = document.getElementById('railList');
  list.innerHTML = '';
  MODULES.forEach((m,i) => {
    const state = cleared(i) ? 'cleared' : (unlocked(i) ? 'active' : 'locked');
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'rung' + (i === openIdx && !S.finished ? ' is-open' : '');
    b.dataset.s = state;
    b.disabled = !unlocked(i);
    b.innerHTML = '<span class="rung__no">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span>' + esc(m.title) + '<span class="rung__state">' + state + '</span></span>';
    b.onclick = () => { openIdx = i; phase = 'read'; S.finished = false; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    li.appendChild(b);
    list.appendChild(li);
  });
}

/* ---------- screens ---------- */
function screenStart(){
  return `<div class="card">
    <div class="u eyebrow">Before you begin</div>
    <h1>Field Operations Onboarding</h1>
    <p class="lede">${MODULES.length} modules, each ending in a short check. You can't move
    forward until the check is passed, and you can retry as many times as you need.</p>
    <label class="field">
      <span class="u" style="color:var(--ink-soft)">Your full name</span>
      <input id="nameIn" type="text" autocomplete="name" placeholder="As it should appear on your certificate">
    </label>
    <div class="btnrow"><button class="btn" id="startBtn">Start onboarding</button></div>
    <hr class="divider">
    <p class="note">Your progress is saved in this browser on this device. You can close the
    tab and come back over several days. If you switch to a different device or browser,
    or use a private window, you'll start again from module 01.</p>
  </div>`;
}

function screenRead(i){
  const m = MODULES[i];
  const vid = m.video
    ? `<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${esc(m.video)}?rel=0"
         title="${esc(m.title)}" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"
         allowfullscreen loading="lazy"></iframe></div>` : '';
  const done = cleared(i);
  return `
    <div class="u eyebrow">Module ${String(i+1).padStart(2,'0')} of ${String(MODULES.length).padStart(2,'0')}</div>
    <h1>${esc(m.title)}</h1>
    ${m.lede ? `<p class="lede">${esc(m.lede)}</p>` : ''}
    ${vid}
    <div class="prose">${m.body}</div>
    <hr class="divider">
    <div class="handoff">
      <div>
        <div class="u" style="color:var(--ink-soft);margin-bottom:6px">Next</div>
        <p style="margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:17px">
          ${done ? 'Comprehension check — already cleared' : 'Comprehension check'}
        </p>
        <p class="note" style="margin:0">${m.quiz.length} question${m.quiz.length>1?'s':''}. The material
        isn't on screen during the check, so read it properly first. Unlimited attempts.</p>
      </div>
      <button class="btn" id="toQuizBtn">${done ? 'Retake the check' : 'Start the check'}</button>
    </div>`;
}

function screenQuiz(i){
  const m = MODULES[i];
  const qs = m.quiz.map((q,qi) => `
    <div class="q" data-q="${qi}">
      <p class="q__text">${qi+1}. ${esc(q.q)}</p>
      ${q.options.map((o,oi) => `
        <label class="opt" data-o="${oi}">
          <input type="radio" name="q${qi}" value="${oi}">
          <span>${esc(o)}</span>
          <span class="flag"></span>
        </label>`).join('')}
    </div>`).join('');

  const done = cleared(i);
  return `
    <div class="u eyebrow">Module ${String(i+1).padStart(2,'0')} — comprehension check</div>
    <h1>${esc(m.title)}</h1>
    <section class="quiz" id="quiz">
      <div class="quiz__head">
        <span class="u">${m.quiz.length} question${m.quiz.length>1?'s':''}</span>
        <span class="u">${done ? 'Cleared' : 'Required to continue'}</span>
      </div>
      <h2>${done ? 'Retaking a cleared check' : 'Answer all questions to unlock the next module'}</h2>
      ${qs}
      <div class="btnrow">
        <button class="btn" id="markBtn">Check answers</button>
        <button class="btn btn--ghost" id="backBtn">Back to the material</button>
        ${done ? `<button class="btn btn--go" id="fwdBtn">${i+1 < MODULES.length ? 'Next module' : 'View certificate'}</button>` : ''}
      </div>
      <div class="verdict hidden" id="verdict"></div>
    </section>`;
}

function screenCert(){
  const d = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  return `
    <div class="cert">
      <div class="cert__seal">Frodobots — Field Operations</div>
      <div class="cert__line"></div>
      <p class="note" style="margin:0">This confirms that</p>
      <div class="cert__name">${esc(S.name)}</div>
      <p class="note" style="margin:0 auto;max-width:34ch">has completed all ${MODULES.length} onboarding
      modules and passed every comprehension check.</p>
      <div class="cert__line"></div>
      <div class="cert__meta">
        Completed ${d}<br>
        Verification code
        <div class="cert__code">${code()}</div>
      </div>
    </div>
    <div class="btnrow noprint" style="margin-top:26px">
      <button class="btn" id="printBtn">Save or print certificate</button>
      <button class="btn btn--ghost" id="resetBtn">Reset my progress</button>
    </div>
    <p class="note noprint" style="margin-top:20px;max-width:52ch">Send the saved certificate,
    or the verification code above, to your onboarding contact.</p>`;
}

/* ---------- marking ---------- */
function mark(i){
  const m = MODULES[i], quiz = document.getElementById('quiz');
  let right = 0, answered = 0;

  m.quiz.forEach((q,qi) => {
    const block = quiz.querySelector('[data-q="'+qi+'"]');
    const picked = block.querySelector('input:checked');
    block.querySelectorAll('.opt').forEach(o => { o.classList.remove('ok','no'); o.querySelector('.flag').textContent = ''; });
    if(!picked) return;
    answered++;
    const pi = Number(picked.value);
    const opt = block.querySelector('.opt[data-o="'+pi+'"]');
    if(pi === q.answer){ right++; opt.classList.add('ok'); opt.querySelector('.flag').textContent = 'Correct'; }
    else{
      opt.classList.add('no'); opt.querySelector('.flag').textContent = 'Not this one';
      const truth = block.querySelector('.opt[data-o="'+q.answer+'"]');
      truth.classList.add('ok'); truth.querySelector('.flag').textContent = 'Correct';
    }
  });

  const v = document.getElementById('verdict');
  v.classList.remove('hidden');

  if(answered < m.quiz.length){
    v.dataset.v = 'fail';
    v.textContent = 'Answer every question before checking — ' + (m.quiz.length - answered) + ' still blank.';
    return;
  }

  const score = right / m.quiz.length;
  if(score >= PASS_MARK){
    v.dataset.v = 'pass';
    v.textContent = 'Passed — ' + right + ' of ' + m.quiz.length + ' correct. Module ' +
                    String(i+1).padStart(2,'0') + ' cleared.';
    if(!cleared(i)){ S.done.push(i); S.done.sort((a,b)=>a-b); save(); }
    paintMeter(); paintRail();
    if(!document.getElementById('fwdBtn')){
      const b = document.createElement('button');
      b.className = 'btn btn--go'; b.id = 'fwdBtn';
      b.textContent = i+1 < MODULES.length ? 'Next module' : 'View certificate';
      b.onclick = forward;
      document.querySelector('.btnrow').appendChild(b);
    }
  }else{
    v.dataset.v = 'fail';
    v.textContent = right + ' of ' + m.quiz.length + ' correct. Read the marked answers above, ' +
                    'then check again — there\'s no limit on attempts.';
    m.quiz.forEach((q,qi) => {
      if(!q.why) return;
      const block = document.querySelector('[data-q="'+qi+'"]');
      if(block.querySelector('.opt.no')){
        const p = document.createElement('p');
        p.className = 'note'; p.style.marginTop = '10px';
        p.textContent = q.why;
        block.appendChild(p);
      }
    });
  }
}

function forward(){
  phase = 'read';
  if(openIdx + 1 < MODULES.length){ openIdx++; }
  else { S.finished = true; save(); }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- render ---------- */
function render(){
  const stage = document.getElementById('stage');
  paintMeter();

  if(!S.name){
    stage.innerHTML = screenStart();
    paintRail();
    const go = () => {
      const val = document.getElementById('nameIn').value.trim();
      if(!val){ document.getElementById('nameIn').focus(); return; }
      S.name = val; save(); openIdx = nextOpen(); render();
    };
    document.getElementById('startBtn').onclick = go;
    document.getElementById('nameIn').onkeydown = e => { if(e.key === 'Enter') go(); };
    return;
  }

  if(S.finished && S.done.length === MODULES.length){
    stage.innerHTML = screenCert();
    paintRail();
    document.getElementById('printBtn').onclick = () => window.print();
    document.getElementById('resetBtn').onclick = () => {
      if(confirm('This clears all progress on this device and starts again from module 01.')){
        S = {name:'',done:[],finished:false}; save(); openIdx = 0; phase = 'read'; render();
      }
    };
    return;
  }

  if(phase === 'read'){
    stage.innerHTML = screenRead(openIdx);
    paintRail();
    document.getElementById('toQuizBtn').onclick = () => {
      phase = 'quiz'; render(); window.scrollTo({top:0,behavior:'smooth'});
    };
    return;
  }

  stage.innerHTML = screenQuiz(openIdx);
  paintRail();
  document.getElementById('markBtn').onclick = () => mark(openIdx);
  document.getElementById('backBtn').onclick = () => {
    phase = 'read'; render(); window.scrollTo({top:0,behavior:'smooth'});
  };
  const fwd = document.getElementById('fwdBtn');
  if(fwd) fwd.onclick = forward;
}

openIdx = nextOpen();
render();
</script>
